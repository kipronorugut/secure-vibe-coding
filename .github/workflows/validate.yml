name: Validate Agent Skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  skill-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check skill metadata and instructions
        run: python3 tools/validate_skills.py
      - name: Lint helper scripts
        run: shellcheck -S warning skills/*/scripts/*.sh
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
